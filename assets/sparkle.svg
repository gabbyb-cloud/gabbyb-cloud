<svg width="90" height="40" viewBox="0 0 90 40" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E9A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF2E9A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- shooting star comet -->
  <g>
    <path d="M 0 0 L 22 8 L 0 6 Z" fill="url(#trail)">
      <animateMotion path="M5,32 L70,4" dur="2.6s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <circle r="1.6" fill="#FDE8FF">
      <animateMotion path="M5,32 L70,4" dur="2.6s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- twinkling sparkles -->
  <g fill="#8B2FE0">
    <path d="M78,10 l1.2,3 3,1.2 -3,1.2 -1.2,3 -1.2,-3 -3,-1.2 3,-1.2 z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#FF2E9A">
    <path d="M12,4 l0.8,2 2,0.8 -2,0.8 -0.8,2 -0.8,-2 -2,-0.8 2,-0.8 z">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#FDE8FF">
    <path d="M45,34 l0.6,1.6 1.6,0.6 -1.6,0.6 -0.6,1.6 -0.6,-1.6 -1.6,-0.6 1.6,-0.6 z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
